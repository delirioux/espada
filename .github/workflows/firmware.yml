# SPDX-License-Identifier: GPL-3.0-only
# Makohai's firmware package for the FM-1, built on GitHub's Linux runners: JieLi's toolchain and three files of the
# JieLi AC79 SDK (Apache-2.0) come from JieLi's own servers. Every push builds the package (the run's artifact
# "makohai-firmware") and runs the host mode (artifact "makohai-host": screens as PNG, the sound as WAV).
# A tag vX.Y builds the release package (identity FM-1_96Y) and attaches it to a GitHub release.
# A push to main also publishes the site on GitHub Pages: the web installer with that package
# (web/makohai_make_site.py) and Makohai in the browser (web/emu). The site needs Settings > Pages > Source:
# GitHub Actions.
name: Firmware

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow
      - name: No variable shared with the platform by name (C merges two `static` declarations of one name)
        run: python3 tools/check_names.py

      - name: Host mode (the default script and the tour)
        run: |
          sh tests/run_host.sh
          build/host/makohai build/host/demo tests/demo.txt
      - uses: actions/upload-artifact@v4
        with:
          name: makohai-host
          path: |
            build/host/*.png
            build/host/*.wav

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # the site names the build with git describe

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install Pillow

      - name: JieLi toolchain (clang 4.0.1 for pi32v2)
        run: sh tools/get_toolchain.sh

      - name: JieLi AC79 SDK (three of its files go into the package)
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"

      - name: Build Makohai
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then ./build.sh --release "${GITHUB_REF_NAME#v}"; else ./build.sh; fi

      - name: No 64-bit division or soft-float routines in the image (a routine like __mulsf3 crashed an FM-1 in Tuna)
        run: |
          NM=$(find "$HOME/.jieli/toolchain/" -name "*nm" -type f -perm -u+x | head -1)
          if "$NM" build/makohai.elf | grep -E '\s__(u?divdi3|u?moddi3)$|\s__(add|sub|mul|div|neg)[sd]f[23]$|\s__(fix|float|extend|trunc)\w*[sd]f\w*$|\s__(eq|ne|lt|le|gt|ge|unord|cmp)[sd]f2$'; then
            echo "helper routines the chip does not have (Makohai is integers only: docs/RULES.md)"; exit 1
          fi
          echo "none"

      - name: Package
        run: |
          mkdir -p dist/debug
          cp build/makohai*.fwsc dist/
          cp LICENSE LICENSING.md dist/
          "$(find "$HOME/.jieli/toolchain/" -name "*nm" -type f -perm -u+x | head -1)" -n build/makohai.elf > dist/debug/makohai.sym
          gzip -c build/makohai.dis > dist/debug/makohai.dis.gz
          ls -l dist dist/debug

      - uses: actions/upload-artifact@v4
        with:
          name: makohai-firmware
          path: dist/

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/makohai-*.fwsc --title "Makohai ${GITHUB_REF_NAME#v}" --notes-file docs/RELEASE.md

      - name: Makohai in the browser (WebAssembly, on Felucca's page)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true            # (the site goes out without it)
        run: |
          command -v wasm-ld >/dev/null || sudo apt-get install -y -q lld
          sh web/emu/makohai_build.sh "$(git describe --tags --always)"
          node web/emu/makohai_emu_test.mjs build/makohai_emu/makohai.wasm

      - name: Site (the web installer with this package)
        if: github.ref == 'refs/heads/main'
        run: python3 web/makohai_make_site.py build/makohai.fwsc "$(git describe --tags --always)" _site

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
